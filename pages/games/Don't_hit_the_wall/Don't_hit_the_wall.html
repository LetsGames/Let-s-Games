<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Don't Hit The Wall | Let's Games</title>

    <link rel="icon" href="../../../images/favicon-32x32.png" />
    <link rel="stylesheet" href="../../../css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <a href="../../../index.html" class="logo" aria-label="Let's Games home">
        <img
          src="../../../images/Logo Let's Games-doorzichig.webp"
          alt="Let's Games"
        />
      </a>

      <div class="game-header-title">DON'T HIT THE WALL</div>

      <a href="../login.html" class="login-link" aria-label="Inloggen">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="7" r="4"></circle>
          <path d="M4 21v-2a8 8 0 0 1 16 0v2z"></path>
        </svg>
      </a>
    </header>

    <!-- GAME PAGINA -->
    <main class="dhtw-page">
      <!-- GAME -->
      <section class="dhtw-game-section">
        <div class="dhtw-game-frame">
          <!-- Browserversie van jouw Pygame-game -->
          <iframe
            src="build/web/index.html"
            title="Don't Hit The Wall"
            width="1000"
            height="750"
          >
          </iframe>
        </div>
      </section>

      <!-- SPELUITLEG -->
      <section class="dhtw-information">
        <p class="dhtw-slogan">
          Hoe lang kan jij rijden zonder de muur te raken?
        </p>

        <h2>CONTROLS</h2>

        <div class="dhtw-controls">
          <div class="dhtw-control">
            <span>↑</span>
            <p>Versnellen / vooruit rijden</p>
          </div>

          <div class="dhtw-control">
            <span>↓</span>
            <p>Afremmen / achteruit rijden</p>
          </div>

          <div class="dhtw-control">
            <span>←</span>
            <p>Naar links draaien</p>
          </div>

          <div class="dhtw-control">
            <span>→</span>
            <p>Naar rechts draaien</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
